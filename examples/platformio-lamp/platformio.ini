; Проект «кнопка и светодиод» для урока 42. Плата ESP32-S3-DevKitC-1.
; Курс написан для Arduino-ESP32 3.x. Официальная платформа espressif32 в PlatformIO
; долго оставалась на ядре 2.x, поэтому здесь взята платформа pioarduino (ядро 3.x).
; Актуальный адрес и версию сверьте на https://github.com/pioarduino/platform-espressif32

[platformio]
default_envs = esp32s3

[common]
build_flags =
    -Wall
    -Wextra

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=1

; Та же плата, но с отладочной информацией для пошаговой отладки по встроенному USB-JTAG
[env:esp32s3_debug]
extends = env:esp32s3
build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup

; Проверка логики на компьютере, без платы: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
